name: Build and Release

on:
  push:
    branches: [master]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 'latest'

    - name: Check if version is new
      id: check
      run: |
        VERSION=$(uv version --short)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
          echo "Tag v$VERSION already exists, skipping release"
          echo "is_new=false" >> "$GITHUB_OUTPUT"
        else
          echo "New version: $VERSION"
          echo "is_new=true" >> "$GITHUB_OUTPUT"
        fi

  build-binaries:
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: exportify-cli-linux-x86_64
          - os: ubuntu-24.04-arm
            binary_name: exportify-cli-linux-arm64
          - os: windows-latest
            binary_name: exportify-cli-windows-x86_64.exe
          - os: windows-11-arm
            binary_name: exportify-cli-windows-arm64.exe
          - os: macos-15-intel
            binary_name: exportify-cli-macos-x86_64
          - os: macos-latest
            binary_name: exportify-cli-macos-arm64

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 'latest'

    - name: Set up Python
      run: uv python install 3.13

    - name: Sync dependencies
      run: uv sync

    - name: Build executable
      shell: bash
      run: |
        echo 'from exportify_cli.cli import main; main()' > _entry.py
        uv run --with pyinstaller pyinstaller --onefile \
          --name '${{ matrix.binary_name }}' \
          --collect-submodules exportify_cli \
          _entry.py

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.binary_name }}
        path: dist/${{ matrix.binary_name }}

  build-dist:
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 'latest'

    - name: Build sdist and wheel
      run: uv build

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: python-dist
        path: dist/*

  publish-pypi:
    needs: [check-version, build-dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exportify-cli/
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download dist
      uses: actions/download-artifact@v6
      with:
        name: python-dist
        path: dist

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 'latest'

    - name: Publish to PyPI
      run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  release:
    needs: [check-version, build-binaries, build-dist, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v6
      with:
        merge-multiple: true
        path: dist

    - name: Create release and tag
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.check-version.outputs.version }}
        target_commitish: ${{ github.sha }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

