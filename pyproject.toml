[project]
name = "exportify-cli"
version = "1.0.1"
description = "Export Spotify playlists to CSV or JSON from the command line."
requires-python = ">=3.13"
license = "GPL-3.0-only"
keywords = ["spotify", "playlist", "export", "csv", "json"]
dependencies = [
    "click>=8.1",
    "click-option-group>=0.5",
    "pathvalidate>=3.0",
    "spotipy>=2.24",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.scripts]
exportify-cli = "exportify_cli.cli:main"

[project.urls]
Homepage = "https://github.com/donmerendolo/exportify-cli"

[build-system]
requires = ["uv_build>=0.6,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
